<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="50%" stop-color="#150a36"/>
      <stop offset="100%" stop-color="#060216"/>
    </linearGradient>
    <linearGradient id="rxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A20A2"/>
      <stop offset="100%" stop-color="#24C6DA"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#rxBg)"/>

  <!-- Header -->
  <text x="600" y="55" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">GoAutomateRX: Intelligent Prescription AI Extraction</text>
  <text x="600" y="85" text-anchor="middle" fill="#24C6DA" font-family="system-ui, sans-serif" font-size="15">Transforming Handwritten &amp; Faxed Prescriptions into Validated Clinical Formats</text>

  <!-- Left: Raw Prescription Input Mockup -->
  <g transform="translate(80, 130)">
    <rect width="460" height="480" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="25" y="25" width="410" height="45" rx="8" fill="rgba(122,32,162,0.2)" stroke="#7A20A2" stroke-width="1"/>
    <text x="45" y="52" fill="#E1BEE7" font-family="system-ui, sans-serif" font-weight="700" font-size="15">INPUT: Scanned Prescription / Doctor Requisition</text>

    <!-- Simulated prescription sheet -->
    <rect x="25" y="90" width="410" height="365" rx="10" fill="#150e2e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="50" y="130" fill="#94A3B8" font-family="monospace" font-size="13">Rx: CLINICAL PHARMACY ORDER</text>
    <line x1="50" y1="145" x2="390" y2="145" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Simulated handwriting text with bounding boxes -->
    <rect x="50" y="170" width="220" height="35" rx="6" fill="rgba(36, 198, 218, 0.15)" stroke="#24C6DA" stroke-width="1.5"/>
    <text x="60" y="193" fill="#80DEEA" font-family="sans-serif" font-size="13">Patient: Basrai, J. [ID: 94821]</text>

    <rect x="50" y="225" width="310" height="40" rx="6" fill="rgba(186, 104, 200, 0.15)" stroke="#BA68C8" stroke-width="1.5"/>
    <text x="60" y="250" fill="#E1BEE7" font-family="sans-serif" font-size="13">Med: Amoxicillin-Clav 875mg PO BID</text>

    <rect x="50" y="285" width="260" height="35" rx="6" fill="rgba(36, 198, 218, 0.15)" stroke="#24C6DA" stroke-width="1.5"/>
    <text x="60" y="308" fill="#80DEEA" font-family="sans-serif" font-size="13">Duration: 10 Days • Qty: 20 Tablets</text>

    <rect x="50" y="340" width="290" height="35" rx="6" fill="rgba(186, 104, 200, 0.15)" stroke="#BA68C8" stroke-width="1.5"/>
    <text x="60" y="363" fill="#E1BEE7" font-family="sans-serif" font-size="13">Refills: 0 • Prescriber: Dr. Reynolds (MD)</text>

    <!-- Scan overlay bar -->
    <line x1="25" y1="210" x2="435" y2="210" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="350" y="425" fill="#00E5FF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OCR ACCURACY: 99.7%</text>
  </g>

  <!-- Central Flow Arrows -->
  <g transform="translate(565, 340)">
    <circle cx="35" cy="0" r="28" fill="url(#rxGrad)"/>
    <polygon points="30,-10 45,0 30,10" fill="#FFFFFF"/>
  </g>

  <!-- Right: Structured Digital Output -->
  <g transform="translate(660, 130)">
    <rect width="460" height="480" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="25" y="25" width="410" height="45" rx="8" fill="rgba(36,198,218,0.2)" stroke="#24C6DA" stroke-width="1"/>
    <text x="45" y="52" fill="#80DEEA" font-family="system-ui, sans-serif" font-weight="700" font-size="15">OUTPUT: Verified EHR &amp; Pharmacy Direct Sync</text>

    <!-- Extracted structured json/cards -->
    <g transform="translate(25, 90)">
      <rect width="410" height="70" rx="10" fill="#150e2e" stroke="rgba(36,198,218,0.3)" stroke-width="1"/>
      <text x="20" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">ACTIVE MEDICATION VALIDATION</text>
      <text x="20" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Amoxicillin / Clavulanate (Augmentin)</text>
      <rect x="310" y="22" width="80" height="25" rx="6" fill="rgba(0, 230, 118, 0.2)" stroke="#00E676" stroke-width="1"/>
      <text x="325" y="38" fill="#00E676" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MATCHED</text>
    </g>

    <g transform="translate(25, 175)">
      <rect width="410" height="70" rx="10" fill="#150e2e" stroke="rgba(186,104,200,0.3)" stroke-width="1"/>
      <text x="20" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">DOSAGE &amp; INTERACTION SAFETY</text>
      <text x="20" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">875mg Twice Daily • No Drug Interactions</text>
      <rect x="310" y="22" width="80" height="25" rx="6" fill="rgba(0, 230, 118, 0.2)" stroke="#00E676" stroke-width="1"/>
      <text x="330" y="38" fill="#00E676" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PASSED</text>
    </g>

    <g transform="translate(25, 260)">
      <rect width="410" height="70" rx="10" fill="#150e2e" stroke="rgba(36,198,218,0.3)" stroke-width="1"/>
      <text x="20" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">HOSPITAL SYSTEM DISPATCH</text>
      <text x="20" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Inbound to Kroll / Cerner Pharmacy HIS</text>
      <rect x="310" y="22" width="80" height="25" rx="6" fill="rgba(36, 198, 218, 0.2)" stroke="#24C6DA" stroke-width="1"/>
      <text x="325" y="38" fill="#80DEEA" font-family="system-ui, sans-serif" font-size="11" font-weight="700">QUEUED</text>
    </g>

    <g transform="translate(25, 345)">
      <rect width="410" height="110" rx="10" fill="rgba(122,32,162,0.15)" stroke="#7A20A2" stroke-width="1"/>
      <text x="20" y="28" fill="#E1BEE7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Clinical Impact &amp; Benefit</text>
      <text x="20" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">✓ Zero manual transcription burden on pharmacists</text>
      <text x="20" y="74" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">✓ Instant reconciliation with patient allergy histories</text>
      <text x="20" y="96" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">✓ Rapid turnaround time for urgent inpatient orders</text>
    </g>
  </g>
</svg>
